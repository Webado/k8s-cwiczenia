# RabbitMQ jako zwykły Deployment. To uproszczenie na potrzeby lekcji.
# Na produkcji stateful rzeczy (kolejki, bazy) to zwykle StatefulSet + PersistentVolume,
# operator (np. RabbitMQ Cluster Operator) albo usługa zarządzana (Amazon MQ, RDS).
# Bez trwałego wolumenu restart poda = utrata wiadomości w kolejkach!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: lekcja1
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq          # <- dlatego w ConfigMapie RABBITMQ_HOST: "rabbitmq"
  namespace: lekcja1
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
