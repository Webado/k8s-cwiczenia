# SPOILER! Nie czytaj przed rozwiązaniem incydentu.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-v1
  namespace: incydenty
data:
  index.php: |
    <?php header('Content-Type: application/json'); echo json_encode(['version' => 'v1', 'pod' => gethostname()]), "\n";
  health.php: |
    <?php echo "ok";
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: incydenty
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: incydenty
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: php
          image: php:8.3-apache
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /health.php, port: 80 }
            periodSeconds: 3
          volumeMounts:
            - { name: code, mountPath: /var/www/html }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: code
          configMap: { name: api-v1 }
