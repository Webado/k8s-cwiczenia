# Produkcja: BEZ "automated". Argo pokazuje różnice (OutOfSync), ale wdraża dopiero,
# gdy człowiek kliknie Sync. Częsty wzorzec: staging auto, prod ręcznie.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: main
    path: 02-helm-argo/chart
    helm:
      releaseName: demo
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
